spring:
  application:
    name: spring-ai-customer-service-rag
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/customer_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: when_missing
      chat:
        model: ${OLLAMA_CHAT_MODEL:granite3.3:2b}
        num-ctx: 4096
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:granite-embedding:278m}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: hnsw
  threads:
    virtual:
      enabled: true

app:
  ingestion:
    enabled: ${KNOWLEDGE_INGESTION_ENABLED:true}

logging:
  level:
    org.springframework.ai.rag: debug
    com.cythzz.ai.spring: info
